name: bootstrap-enterprise-v2
on:
  push:
    paths:
      - '.github/workflows/bootstrap-enterprise-v2.yml'
      - '.bootstrap/**'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and unpack verified release
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.xz
          xz -t /tmp/payload.tar.xz
          rm -rf README.md
          tar -xJf /tmp/payload.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-enterprise-v2.yml
      - name: Commit enterprise v2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SYNERGY Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "release: publish enterprise v2.0.0"
          git push origin HEAD:main

# retrigger-v2
